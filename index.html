<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rótulos de redistribución · Nexocorp</title>
<style>
:root{--bg:#f3f4fa;--card:#fff;--tx:#1b1d2e;--mu:#6a6e86;--bd:#dcdeea;--pr:#4a42d6;--pr2:#3a33b8;--prt:#fff;--ok:#117a4d;--er:#b3261e;--sh:0 1px 3px rgba(20,20,60,.12);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131c;--card:#1c1e2b;--tx:#eceefa;--mu:#9a9eb8;--bd:#33364a;--pr:#8b84ff;--pr2:#a39eff;--prt:#12131c;--ok:#4cd694;--er:#ff8a80;--sh:0 1px 3px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131c;--card:#1c1e2b;--tx:#eceefa;--mu:#9a9eb8;--bd:#33364a;--pr:#8b84ff;--pr2:#a39eff;--prt:#12131c;--ok:#4cd694;--er:#ff8a80;--sh:0 1px 3px rgba(0,0,0,.5);color-scheme:dark}
html,body{margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
header img{width:42px;height:42px;border-radius:10px}
header h1{font-size:18px;margin:0}
header small{color:var(--mu);display:block;font-size:12.5px}
header .sp{flex:1}
main{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:16px;padding:16px 20px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:var(--sh)}
.card h2{font-size:15px;margin:0 0 12px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input:focus{outline:2px solid var(--pr);outline-offset:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:70px auto 70px 1fr;gap:8px;align-items:center}
.hint{font-size:12px;color:var(--mu);margin-top:3px}
.hint.er{color:var(--er)}.hint.ok{color:var(--ok)}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--tx);margin-top:10px}
.chk input{width:auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px}
button.p{background:var(--pr);border-color:var(--pr);color:var(--prt);font-weight:600}
button.p:hover{background:var(--pr2)}
button:disabled{opacity:.45;cursor:not-allowed}
button.lnk{border:0;background:none;color:var(--pr);padding:0;text-decoration:underline}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
.stat{font-size:13.5px}.stat b{color:var(--pr)}
#pvwrap{margin-top:14px;border:1px dashed var(--bd);border-radius:10px;padding:10px;background:#fff;overflow:hidden}
#sheetwrap{overflow:hidden}
#sheet{display:flex;flex-direction:column;gap:14px;align-items:center}
.page{width:210mm;height:296mm;background:#fff;box-shadow:var(--sh);zoom:var(--z,1);display:flex;flex-direction:column;break-after:page}
.page:last-child{break-after:auto}
.slot{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slot+.slot{border-top:1px dashed #b5b5b5}
.empty{color:#999;font:14px Arial,sans-serif;border:2px dashed #ccc;border-radius:10px;padding:60px 90px}
.del{position:absolute;top:8px;right:10px;width:30px;height:30px;padding:0;border-radius:50%;font-size:18px;line-height:1}
/* ROTULO: formato del Excel */
.lbl{width:680px;font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;padding:4px}
.lbl .banner{display:block;width:60%;margin:0 0 8px 19%;height:auto}
.lbl .row{display:grid;grid-template-columns:18% 1fr;border:1px solid #000;height:40px}
.lbl .k{font-weight:700;font-size:18px;display:flex;align-items:center;padding-left:5px;border-right:1px solid #000}
.lbl .v{font-weight:700;font-size:29px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.lbl .v.b{font-size:27px}
.lbl .v.ref{font:400 16px Calibri,Carlito,Arial,sans-serif}
.lbl .ad{font:14.5px/18px Calibri,Carlito,Arial,sans-serif;min-height:18px;margin:2px 0 14px}
.lbl .bc{margin:26px auto 0;width:70%;text-align:center}
.lbl .bc svg{width:100%;height:72px;display:block}
.lbl .bc div{font-size:17px;letter-spacing:1px;margin-top:6px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:520px;width:calc(100% - 24px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.cl{max-height:150px;overflow:auto;margin-top:10px;font-size:13px}
.cl div{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--bd)}
.cl span{flex:1}
@page{size:A4;margin:0}
@media print{
html,body{background:#fff}
header,.left,.bar,.del,.empty,.noprint{display:none!important}
main{display:block;padding:0}
.card{border:0;box-shadow:none;padding:0;background:none}
#sheet{display:block;gap:0}
.page{zoom:1;box-shadow:none}
.slot+.slot{border-top:1px dashed #bbb}
}
</style>
</head>

const KEY="rotulos_redistribucion_v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={custom:[],queue:[],last:[],o:"B300",d:"",ref:"REVERSION"};
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let pending=false,uid=Date.now();
const C39={"0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn","A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn","F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn","K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn","P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn","U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn","Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","*":"nwnnwnwnn","$":"nwnwnwnnn","/":"nwnwnnnwn","+":"nwnnnwnwn","%":"nnnwnwnwn"};
function barcode(t){
  const s=("*"+t.toUpperCase().replace(/[^0-9A-Z\-. $\/+%]/g,"")+"*");let x=0,r="";
  for(const ch of s){const p=C39[ch];if(!p)continue;
    for(let i=0;i<9;i++){const w=p[i]==="w"?3:1;if(i%2===0)r+=`<rect x="${x}" y="0" width="${w}" height="60"/>`;x+=w}
    x+=1}
  return `<svg viewBox="0 0 ${x} 60" preserveAspectRatio="none" shape-rendering="crispEdges" fill="#000">${r}</svg>`;
}
function dir(){const m=new Map();for(const b of BASE)if(!m.has(b[0]))m.set(b[0],b);for(const c of S.custom)m.set(c[0],c);return m}
function look(c){return dir().get((c||"").toUpperCase())}
function lblHTML(r){
  const o=look(r.origen),d=look(r.destino),code=`${r.envio} ${r.origen} ${r.destino}`;
  const fs=r.envio.length>12?"font-size:22px":"";
  return `<div class="lbl"><img class="banner" src="${BANNER}" alt="NEXOCORP">
<div class="row"><div class="k">NRO. ENVIO:</div><div class="v" style="${fs}">${esc(r.envio)||"&nbsp;"}</div></div><div style="height:14px"></div>
<div class="row"><div class="k">ORIGEN:</div><div class="v">${esc(r.origen)}</div></div><div class="ad">${o?esc(o[2]):""}</div>
<div class="row"><div class="k">DESTINO:</div><div class="v">${esc(r.destino)}</div></div><div class="ad">${d?esc(d[2]):""}</div>
<div class="row"><div class="k">BULTOS:</div><div class="v b">${esc(r.bultos)}</div></div><div style="height:16px"></div>
<div class="row" style="height:48px"><div class="k">REFERENCIA:</div><div class="v ref">${esc(r.ref)}</div></div>
<div class="bc">${barcode(code)}<div>${esc(code)}</div></div></div>`;
}
function cur(){return{envio:$("envio").value.trim(),origen:$("origen").value.trim().toUpperCase(),destino:$("destino").value.trim().toUpperCase(),bultos:`${$("bn").value||1} DE ${$("bt").value||1}`,ref:$("ref").value.trim()}}
function hint(id,c,lab){
  const el=$(id);c=c.toUpperCase();
  if(!c){el.textContent="";el.className="hint";return}
  const f=look(c);
  if(f){el.className="hint ok";el.textContent=f[2]}
  else if(c.length===4){el.className="hint er";el.innerHTML=`${esc(c)} no está registrada. <button class="lnk" data-add="${esc(c)}">Agregar ${lab}</button>`}
  else{el.className="hint";el.textContent="Código completo de 4 caracteres"}
}
function fit(){
  const w=$("pvwrap").clientWidth-20;const p=$("pv").firstElementChild;if(p)p.style.zoom=Math.min(1,w/690);
  $("sheet").style.setProperty("--z",Math.min(1,($("sheetwrap").clientWidth)/794));
}
function upd(){
  const r=cur();
  hint("hO",r.origen,"origen");hint("hD",r.destino,"destino");
  $("pv").innerHTML=lblHTML(r);
  $("bAdd").disabled=!(r.envio&&r.origen.length===4&&r.destino.length===4);
  fit();
}
function render(){
  const q=S.queue,n=q.length,pg=Math.max(1,Math.ceil(n/2));let h="";
  for(let p=0;p<pg;p++){h+='<div class="page">';
    for(let s=0;s<2;s++){const it=q[p*2+s];
      h+=`<div class="slot">${it?lblHTML(it)+`<button class="del" data-del="${it.id}" title="Quitar">×</button>`:'<div class="empty">Espacio libre</div>'}</div>`}
    h+="</div>"}
  $("sheet").innerHTML=h;
  $("stat").innerHTML=n?`<b>${n}</b> rótulo${n>1?"s":""} · <b>${pg}</b> hoja${pg>1?"s":""}${n%2?" · queda 1 espacio libre":""}`:"Sin rótulos en la hoja";
  $("bPrint").disabled=!n;$("bClear").disabled=!n;$("bUndo").hidden=!S.last.length;
  $("bPrint").textContent=n?`Imprimir ${pg} hoja${pg>1?"s":""}`:"Imprimir";
  fit();save();
}
function add(){
  const r=cur();if(!(r.envio&&r.origen.length===4&&r.destino.length===4))return;
  const nn=parseInt($("bt").value)||1;
  if($("all").checked&&nn>1){for(let i=1;i<=Math.min(nn,60);i++)S.queue.push({...r,bultos:`${i} DE ${nn}`,id:++uid})}
  else S.queue.push({...r,id:++uid});
  S.o=r.origen;S.d=r.destino;S.ref=r.ref;
  $("envio").value="";$("bn").value=1;$("bt").value=1;$("all").checked=false;
  upd();render();$("envio").focus();
}
function doPrint(){if(!S.queue.length)return;pending=true;window.print()}
window.addEventListener("afterprint",()=>{if(!pending)return;pending=false;S.last=S.queue;S.queue=[];render()});
function fillDL(){$("dl").innerHTML=[...dir().values()].map(b=>`<option value="${esc(b[0])}">${esc(b[1])}</option>`).join("")}
function adminList(){
  $("cl").innerHTML=S.custom.map((c,i)=>`<div><span><b>${esc(c[0])}</b> · ${esc(c[2])}</span><button data-rm="${i}">Quitar</button></div>`).join("");
}
function openAdmin(code){$("nc").value=code||"";$("nd").value="";$("ne").textContent="";adminList();$("dlg").showModal();(code?$("nd"):$("nc")).focus()}
function saveBod(){
  const c=$("nc").value.trim().toUpperCase(),d=$("nd").value.trim();
  if(c.length!==4){$("ne").textContent="El código debe tener 4 caracteres.";return}
  if(!d){$("ne").textContent="Escribe la dirección o nombre.";return}
  S.custom=S.custom.filter(x=>x[0]!==c);S.custom.push([c,d,d]);
  fillDL();adminList();$("nc").value="";$("nd").value="";$("ne").textContent="";upd();render();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.add)openAdmin(t.dataset.add);
  if(t.dataset.del){S.queue=S.queue.filter(x=>x.id!=t.dataset.del);render()}
  if(t.dataset.rm!==undefined){S.custom.splice(+t.dataset.rm,1);fillDL();adminList();upd()}
});
$("bAdd").onclick=add;$("bPrint").onclick=doPrint;$("bAdmin").onclick=()=>openAdmin();
$("bClear").onclick=()=>{if(S.queue.length&&confirm("¿Vaciar todos los rótulos de la hoja?")){S.queue=[];render()}};
$("bUndo").onclick=()=>{S.queue=S.last.concat(S.queue);S.last=[];render()};
$("ns").onclick=saveBod;$("nx").onclick=()=>$("dlg").close();
["envio","origen","destino","bn","bt","ref"].forEach(i=>$(i).addEventListener("input",upd));
$("envio").addEventListener("input",e=>{const v=e.target.value.toUpperCase().replace(/[^0-9A-Z\-. $\/+%]/g,"");if(v!==e.target.value)e.target.value=v});
$("envio").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
window.addEventListener("resize",fit);
$("origen").value=S.o;$("destino").value=S.d;$("ref").value=S.ref;
fillDL();upd();render();
</script>
</body>
</html>
